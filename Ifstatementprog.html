if (!score){

}
    
   function Randomizer(Player){

     const Comp = pickComputer();

    }
    
    } else if (Player==='Rock'){

    }else if (Comp === 'Scissor'){
      result='You win';

    }
    }

    alert(`You picked ${Player}. Computer picked ${Comp}. ${r}.\n \t You: ${score.you} Computer: ${score.loss} Tie: ${score.tied}`);
   
   }
   function pickComputer(){
  let Comp='';
  const dom = Math.random();
  if (dom>= 0 && dom <1/3){
   Comp='Rock';
  }else if(dom>=1/3 && dom < 2/3){
   Comp='Paper';
  }else if (dom>=2/3 && dom< 1){
   Comp='Scissor';
  }
  return Comp;
   }
